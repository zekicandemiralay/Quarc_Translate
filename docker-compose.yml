services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - translate_data:/app/data
    environment:
      - PORT=3005
      - DB_PATH=/app/data/translate.db
      - JWT_SECRET=${JWT_SECRET:-insecure-default-change-in-production}
      - ENGINE_URL=http://translate-engine:5000
      - ENGINE_TIMEOUT=${ENGINE_TIMEOUT:-45000}
      # Extra web origins allowed to call the API with the login cookie (comma-separated).
      # Not needed: the app's own address, the Android app and the desktop app are always allowed.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - translate-engine
    networks:
      - app-network

  # Self-hosted translation engine — free, keyless, and your text never leaves
  # this machine. Not published to the host; only `backend` talks to it.
  #
  # Pairs with a dedicated model (Turkish, German, French, Spanish, Italian,
  # Portuguese and more <-> English) use it; pairs that have two dedicated halves go
  # through English; everything else runs on NLLB-200 (~200 languages).
  # Models are downloaded on first use into `translate_models` — the first
  # translation of a new pair waits for that (the app shows progress), after
  # that it is instant.
  translate-engine:
    build:
      context: ./translate-engine
      dockerfile: Dockerfile
    environment:
      # RAM the loaded models may use together (MB). The general model (NLLB 1.3B)
      # is ~1.5 GB, a dedicated pair 0.1–0.3 GB. Least recently used go first.
      - MODEL_RAM_MB=${MODEL_RAM_MB:-2600}
      - MAX_LOADED_MODELS=${MAX_LOADED_MODELS:-0}
      # "1.3B" (better) or "600M" (lighter) — for languages without a dedicated model.
      - NLLB_MODEL=${NLLB_MODEL:-1.3B}
      # "auto": chain two dedicated models through English when no direct one exists. "off": use NLLB.
      - PIVOT=${PIVOT:-auto}
      # Downloaded in the background after start so nobody waits for them later.
      - PREPARE_ON_START=${PREPARE_ON_START-tr:en,en:tr,en:de,de:en}
      # CPU threads per translation, and how many translations run at once.
      - TRANSLATE_THREADS=${TRANSLATE_THREADS:-4}
      - TRANSLATE_CONCURRENCY=${TRANSLATE_CONCURRENCY:-2}
      - MIN_FREE_DISK_MB=${MIN_FREE_DISK_MB:-1500}
    # Ceiling for the whole container: a runaway model conversion can restart the
    # engine, but can never take the other Quarc apps on this machine down with it.
    mem_limit: ${ENGINE_MEM_LIMIT:-4500m}
    volumes:
      - translate_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4003:443"
    volumes:
      - /var/lib/tailscale/certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network
      # Lets nginx reach the quarc-auth container by name for /api/auth/*.
      - quarcnet-shared

networks:
  app-network:
    driver: bridge
  quarcnet-shared:
    external: true

volumes:
  translate_data:
  translate_models:
