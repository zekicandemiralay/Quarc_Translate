services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - translate_data:/app/data
    environment:
      - PORT=3005
      - DB_PATH=/app/data/translate.db
      - JWT_SECRET=${JWT_SECRET:-insecure-default-change-in-production}
      - LIBRETRANSLATE_URL=http://translate-engine:5000
    restart: unless-stopped
    depends_on:
      - translate-engine
    networks:
      - app-network

  # Self-hosted translation engine — free, keyless, fully offline once its
  # models are downloaded. Not published to the host; only `backend` talks to
  # it, over the internal app-network.
  #
  # Turkish<->English runs on Helsinki OPUS-MT tc-big (trained for that pair);
  # every other pair runs on NLLB-200. Models download and convert to
  # CTranslate2 int8 on first use into `translate_models`, so the first
  # translation of a new pair is slow and every one after it is fast.
  translate-engine:
    build:
      context: ./translate-engine
      dockerfile: Dockerfile
    environment:
      # How many models may sit in RAM at once (LRU). Each is roughly
      # 300MB (OPUS-MT) to 700MB (NLLB) at int8 — raise only if the host
      # has memory to spare, since this box already runs every other Quarc app.
      - MAX_LOADED_MODELS=${MAX_LOADED_MODELS:-2}
      # CPU threads per translation. Leaves headroom on a 12-core box.
      - TRANSLATE_THREADS=${TRANSLATE_THREADS:-4}
      # Pair preloaded at startup so the first real translation isn't the one
      # that pays for conversion. Set to "" to skip.
      - WARM_PAIR=${WARM_PAIR:-tr:en}
    volumes:
      - translate_models:/models
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4003:443"
    volumes:
      - /var/lib/tailscale/certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network
      # Lets nginx reach the quarc-auth container by name for /api/auth/*.
      - quarcnet-shared

networks:
  app-network:
    driver: bridge
  quarcnet-shared:
    external: true

volumes:
  translate_data:
  translate_models:
