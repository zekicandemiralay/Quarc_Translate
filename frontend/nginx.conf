server {
    listen 443 ssl;
    server_name quarcnet0.tail84500c.ts.net;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.crt;
    ssl_certificate_key /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Shared login (Quarc Auth) — same account works across every Quarc app.
    # More specific than /api/ below, so nginx matches this first for auth routes.
    location /api/auth/ {
        proxy_pass http://quarc-auth:3002/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://backend:3005/api/;
        proxy_http_version 1.1;
        # $http_host keeps the port (":4003"): the backend compares it with the browser's
        # Origin header to tell the app's own pages from other websites.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        # One request is at most ~1000 characters, but the engine may be waking a model up.
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # Built files have a hash in their name: cache them for good.
    # (expires, not add_header: an add_header inside a location would silently drop the
    # security headers set at server level.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page, the service worker and the manifest must always be re-checked,
    # or an update would not reach the phones that already have the app.
    location ~ ^/(index\.html|sw\.js|manifest\.json)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
